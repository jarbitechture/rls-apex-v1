name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # for Azure OIDC if/when used

jobs:
  codegen-drift:
    name: domain.yaml codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r apps/gateway/requirements.txt
      - name: Regenerate types from domain.yaml
        run: bin/codegen
      - name: Fail if generated files differ
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::domain.yaml changed but codegen output not committed"
            git diff
            exit 1
          fi

  ontology-validation:
    name: domain.yaml self-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema
      - run: python bin/validate_domain.py

  smoke-eval:
    name: promptfoo smoke (plumbing only)
    runs-on: ubuntu-latest
    needs: codegen-drift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g promptfoo
      - name: Run smoke eval
        # NEVER use these scores as a quality signal — see
        # eval/smoke/README.md
        run: promptfoo eval -c eval/promptfoo/smoke.yaml --no-cache

  web-build:
    name: web · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  gateway-tests:
    name: gateway · pytest + ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r apps/gateway/requirements.txt -r apps/gateway/requirements-dev.txt
      - run: ruff check apps/gateway
      - run: mypy apps/gateway
      - run: pytest apps/gateway -q
