name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install uv
          uv venv && source .venv/bin/activate
          uv pip install -e "apps/gateway[dev]"
      - name: Lint domain.yaml
        run: uv run python -m tools.domain_lint domain.yaml
      - name: Smoke eval (plumbing-only — never a quality signal)
        run: |
          uv run python -m eval.smoke.run \
            --input eval/smoke/smoke_eval_DO_NOT_OPTIMIZE_AGAINST.jsonl \
            --max-duration 60s
      - name: promptfoo regression
        run: uv run promptfoo eval -c eval/promptfoo/config.yaml --max-concurrency 4

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv && uv venv && source .venv/bin/activate && uv pip install -e "apps/gateway[dev]"
      - run: uv run mypy apps/gateway

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: apps/web
        run: npm ci && npm run typecheck && npm run lint && npm run build
